<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="student.css">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <fieldset>
        <legend>Personal Information</legend>
        <p>
            <label for="">Full Name:</label>
            <input type="text" placeholder="Enter your full name">
        </p>
        <p>
            <label for="">Email:</label>
            <input type="email" placeholder="example@gmail.com">
        </p>
        <p>
            <label for="">Password:</label>
            <input type="text">
        </p>
        <p>
            <label for="">Date of Birth:</label>
            <input type="date">
        </p>
        <p>
            <label for="">Gender:</label>
            <input type="radio" name="gender" value="male">Male
            <input type="radio" name="gender" value="female">Female
        </p>
        <p>
            <label for="">Phone:</label>
            <input type="number">
        </p>
    </fieldset>
    <fieldset>
        <legend>Academic Information</legend>
        <p>
            <label for="">Student ID:</label>
            <input type="text">
        </p>
        <p>
            <label for="">Skills</label>
            <select name="" id="">
                <option value="">Select Major</option>
                <option value="">Imformation Technology</option>
                <option value="">Accounting</option>
                <option value="">Other</option>
            </select>
        </p>
        <p>
            <label for="">Skills:</label>
            <input type="checkbox"> HTML
            <input type="checkbox"> CSS
            <input type="checkbox"> JavaScript
        </p>
        <p>
            <label for="">Upload Photo:</label>
            <input type="file" value="Choose File">
        </p>
    </fieldset>
    <fieldset>
        <legend>Additonal Information</legend>
        <p>
            <label for="">Address:</label>
            <br>
            <textarea rows="4" cols="30"></textarea>
        </p>
        <p>
            <label for="">Personal Website:</label>
            <input type="text">
        </p>
        <p>
            <label for="">Favorite Color:</label>
            <input type="color">
        </p>
    </fieldset>
    <p>
        <input type="checkbox">I agree to the registration terms.
    </p>
    <p>
        <a href="index.html"><input type="button" value="Register"></a>
        <input type="button" value="Clear Form">
    </p>
</body>
</html>
